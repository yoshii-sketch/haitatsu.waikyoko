<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>配達トラッカー v1</title>
<button id="startBtn">▶ 記録開始</button>
<button id="stopBtn">■ 記録停止</button>
<button id="clearBtn">🗑 履歴消去</button>

<p id="recordStatus">記録状態：停止中</p>
    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📰 配達トラッカー v1</h1>

    <div id="map"></div>

    <hr>

    <h2>GPS情報</h2>

    <p id="lat">緯度：</p>
    <p id="lng">経度：</p>
    <p id="accuracy">精度：</p>

    <hr>

    <h2>移動情報</h2>

    <p id="distance">移動距離：</p>
    <p id="status">状態：移動中</p>
    <p id="stopTime">停止時間：0秒</p>

    <hr>

    <h2>システム情報</h2>

    <p id="count">更新回数：0</p>
    <p id="time">更新時刻：</p>
    <p id="debug">判定：</p>

    <script src="script.js"></script>

</body>

</html>
